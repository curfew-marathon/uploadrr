# uploadrr configuration. Mounted read-only at /config/config.ini by
# docker-compose.yml (UPLOADRR_CONFIG_DIR). See README > Configuration.
#
# album_dir / archive_dir are paths INSIDE the container - keep them under /data
# (the host directory bound in via UPLOADRR_DATA_DIR).

[global]
album_dir = /data/albums
archive_dir = /data/archives

# One section per device. `serial` from `adb devices`; `import_dir` is the list of
# subdirectories under album_dir/<section>/ that importrr archives.
#
# [home]
# serial = ABC123DEF456
# import_dir = personal,photos
