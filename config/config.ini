# uploadrr configuration. Mounted read-only at /config/config.ini by
# docker-compose.yml (UPLOADRR_CONFIG_DIR). See README > Configuration.
#
# album_dir / archive_dir are paths INSIDE the container. They default to /data
# itself (the mount of UPLOADRR_DATA_DIR); uploadrr then watches
# /data/<section>/ for each device section below. Point them at subdirectories
# (e.g. /data/archives) only if your host layout keeps albums and archives apart.

[global]
album_dir = /data
archive_dir = /data

# One section per device. `serial` from `adb devices`; `import_dir` is the list of
# subdirectories under album_dir/<section>/ that importrr archives.
#
# [home]
# serial = ABC123DEF456
# import_dir = personal,photos
