[tool.ruff.lint]
extend-ignore = ["E402"]

[tool.ruff.format]
exclude = ["tests/test_adb.py"]

[tool.mypy]
ignore_missing_imports = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["uploadrr.config", "uploadrr.metrics", "uploadrr.listener"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "uploadrr.adb"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "uploadrr.files"
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
