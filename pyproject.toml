[tool.ruff.lint]
extend-ignore = ["E402"]

[tool.mypy]
ignore_missing_imports = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["uploadrr.config", "uploadrr.metrics", "uploadrr.listener"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "uploadrr.adb",
    "uploadrr.adb.transport",
    "uploadrr.adb.archive",
    "uploadrr.adb.transfer",
    "uploadrr.adb.ui",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "uploadrr.files"
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
